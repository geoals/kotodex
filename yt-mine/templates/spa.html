<!DOCTYPE html>
<!-- Always stamped, dark unless the reader chose light: the page's own palette
     (static/styles/base.css) and the shared popup's (/shared/theme.css) must
     agree, and the popup's would otherwise follow the machine. Set before the
     stylesheets so the page never paints in the other theme first. -->
<html lang="en" data-theme="dark">
<head>
    <script>
        try {
            if (localStorage.getItem('yt-mine.theme') === 'light') document.documentElement.dataset.theme = 'light';
        } catch {}
    </script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>yt-mine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/popup.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="app"></div>
    <script type="importmap">
    {
        "imports": {
            "preact": "/shared/vendor/preact.module.js",
            "preact/hooks": "/shared/vendor/preact-hooks.module.js",
            "htm": "/shared/vendor/htm.module.js",
            "htm/preact": "/shared/vendor/htm-preact.module.js",
            "@preact/signals": "/shared/vendor/preact-signals.module.js",
            "@preact/signals-core": "/shared/vendor/preact-signals-core.module.js"
        }
    }
    </script>
    <script type="module" src="/static/app.js"></script>
</body>
</html>
